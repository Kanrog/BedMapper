<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bed Mesh 3D Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bed Mesh 3D Visualizer</h1>
            <p>Paste your console output containing the probe data to generate a 3D surface plot.</p>
        </header>

        <div class="input-section">
            <textarea id="consoleInput" placeholder="// probe at 10.000,10.000 is z=-0.048281&#10;// probe at 10.000,10.000 is z=-0.046875&#10;..."></textarea>
            <button id="renderBtn">Render 3D Mesh</button>
        </div>

        <div class="visualization-section">
            <div id="plotContainer"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
